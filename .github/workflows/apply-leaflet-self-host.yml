name: Apply Leaflet self-host integration

on:
  push:
    branches:
      - agent/self-host-leaflet-1-9-4

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[skip leaflet-self-host]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/self-host-leaflet-1-9-4
          persist-credentials: true

      - name: Apply local Leaflet and controlled lifecycle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          repo = Path('.')
          js_path = repo / 'assets/fwi-planetary-map.js'
          css_path = repo / 'assets/fwi-planetary-map.css'
          js = js_path.read_text(encoding='utf-8')
          css = css_path.read_text(encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          js = replace_once(
              js,
              '/* FutureWorld Intelligence Planetary Computer map integration v1.3 */',
              '/* FutureWorld Intelligence Planetary Computer map integration v1.4 */',
              'map version header',
          )

          helper_anchor = '  function initMap(root){\n'
          helper = '''  function leafletCssReady(scope){
            if(!scope)return false;
            const probe=document.createElement('img');
            probe.className='leaflet-tile';
            probe.alt='';
            probe.setAttribute('aria-hidden','true');
            probe.style.visibility='hidden';
            scope.append(probe);
            const ready=getComputedStyle(probe).position==='absolute';
            probe.remove();
            return ready;
          }

          function initMap(root){
          '''
          js = replace_once(js, helper_anchor, helper, 'Leaflet CSS runtime helper')

          map_line = "    const map=L.map(id,{zoomControl:true,preferCanvas:true}).setView(WORLD_CENTER,WORLD_ZOOM);\n"
          map_block = '''    const mapCanvas=root.querySelector('.fwi-pc-map-canvas');
            if(!leafletCssReady(mapCanvas)){
              root.querySelectorAll('.fwi-pc-map-toolbar select, .fwi-pc-map-toolbar input, .fwi-pc-map-toolbar button').forEach(control=>{control.disabled=true});
              mapCanvas.classList.add('fwi-map-assets-error');
              mapCanvas.setAttribute('role','alert');
              mapCanvas.innerHTML='<div><strong>Map presentation assets did not load.</strong><span>Please refresh the page.</span></div>';
              controls.status.className='fwi-pc-map-status error';
              controls.status.innerHTML='<span class="error"></span><strong>Map presentation assets did not load.</strong> Please refresh the page.';
              return;
            }

            const map=L.map(id,{zoomControl:true,preferCanvas:true}).setView(WORLD_CENTER,WORLD_ZOOM);
          '''
          js = replace_once(js, map_line, map_block, 'map CSS preflight')

          scale_line = '    L.control.scale({imperial:false}).addTo(map);\n'
          scale_block = '''    L.control.scale({imperial:false}).addTo(map);

            let resizeFrame=0;
            function invalidateMapSize(){
              if(map._container&&map._container.isConnected)map.invalidateSize({pan:false});
            }
            function handleWindowResize(){
              if(resizeFrame)window.cancelAnimationFrame(resizeFrame);
              resizeFrame=window.requestAnimationFrame(()=>{resizeFrame=0;invalidateMapSize()});
            }
            window.addEventListener('resize',handleWindowResize,{passive:true});
            window.requestAnimationFrame(invalidateMapSize);
          '''
          js = replace_once(js, scale_line, scale_block, 'controlled map lifecycle')

          boundary_line = '      if(boundaryLayer.getBounds().isValid())map.fitBounds(boundaryLayer.getBounds(),{padding:[24,24],maxZoom:11});\n'
          boundary_block = '''      if(boundaryLayer.getBounds().isValid()){
                map.fitBounds(boundaryLayer.getBounds(),{padding:[24,24],maxZoom:11});
                window.requestAnimationFrame(invalidateMapSize);
              }
          '''
          js = replace_once(js, boundary_line, boundary_block, 'boundary-size refresh')

          tile_line = '      imageryLayer.bringToFront();if(boundaryLayer)boundaryLayer.bringToFront();renderLegend(true);\n'
          tile_block = '      imageryLayer.bringToFront();if(boundaryLayer)boundaryLayer.bringToFront();renderLegend(true);window.requestAnimationFrame(invalidateMapSize);\n'
          js = replace_once(js, tile_line, tile_block, 'evidence-layer size refresh')

          js = replace_once(js, '    setTimeout(()=>map.invalidateSize(),250);\n', '', 'legacy delayed invalidation')
          js_path.write_text(js, encoding='utf-8')

          css = replace_once(
              css,
              '/* FutureWorld Intelligence — live Planetary Computer maps v1.3 */',
              '/* FutureWorld Intelligence — live Planetary Computer maps v1.4 */',
              'map stylesheet version header',
          )
          error_css = '''.fwi-pc-map-canvas.fwi-map-assets-error{display:grid;place-items:center;padding:28px;background:linear-gradient(145deg,rgba(42,8,20,.94),rgba(7,20,38,.98));color:#ffdce3;text-align:center}
          .fwi-pc-map-canvas.fwi-map-assets-error>div{display:grid;gap:8px;max-width:560px;padding:22px;border:1px solid rgba(255,77,109,.42);border-radius:18px;background:rgba(2,6,23,.78)}
          .fwi-pc-map-canvas.fwi-map-assets-error strong{color:#fff;font-size:1rem}
          .fwi-pc-map-canvas.fwi-map-assets-error span{color:#ffdce3;font-size:.86rem}
          '''
          if '.fwi-pc-map-canvas.fwi-map-assets-error' not in css:
              css += '\n' + error_css
          css_path.write_text(css, encoding='utf-8')

          explorer_root = repo / 'pages/climate/evidence-explorer'
          pages = sorted(explorer_root.rglob('index.html'))
          changed_pages = 0
          for page in pages:
              text = page.read_text(encoding='utf-8')
              if 'leaflet@1.9.4' not in text and 'fwi-leaflet-resize-fix.js' not in text:
                  continue
              original = text
              text = re.sub(
                  r'<link rel="stylesheet" href="https://unpkg\.com/leaflet@1\.9\.4/dist/leaflet\.css"(?: integrity="[^"]+")?(?: crossorigin="")?\s*/?>',
                  '<link rel="stylesheet" href="/assets/vendor/leaflet/leaflet.css?v=1.9.4">',
                  text,
              )
              text = re.sub(
                  r'<script src="https://unpkg\.com/leaflet@1\.9\.4/dist/leaflet\.js"(?: integrity="[^"]+")?(?: crossorigin="")?></script>',
                  '<script src="/assets/vendor/leaflet/leaflet.js?v=1.9.4"></script>',
                  text,
              )
              text = re.sub(r'<script src="/assets/fwi-leaflet-resize-fix\.js\?v=1\.0"></script>', '', text)
              text = text.replace('/assets/fwi-planetary-map.css?v=1.3', '/assets/fwi-planetary-map.css?v=1.4')
              text = text.replace('/assets/fwi-planetary-map.js?v=1.3', '/assets/fwi-planetary-map.js?v=1.4')
              if text != original:
                  page.write_text(text, encoding='utf-8')
                  changed_pages += 1

          if changed_pages != 5:
              raise SystemExit(f'Expected five live-map pages to change, changed {changed_pages}')
          PY

      - name: Validate self-hosted Leaflet integration
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/vendor/leaflet/leaflet.js
          node --check assets/fwi-planetary-map.js
          test -s assets/vendor/leaflet/leaflet.css
          test -s assets/vendor/leaflet/LICENSE
          for image in layers.png layers-2x.png marker-icon.png marker-icon-2x.png marker-shadow.png; do
            test -s "assets/vendor/leaflet/images/$image"
          done
          grep -q "getComputedStyle(probe).position==='absolute'" assets/fwi-planetary-map.js
          test "$(grep -c 'window.requestAnimationFrame(invalidateMapSize)' assets/fwi-planetary-map.js)" -eq 3
          test "$(grep -RIl 'assets/vendor/leaflet/leaflet.css?v=1.9.4' pages/climate/evidence-explorer --include='index.html' | wc -l)" -eq 5
          test "$(grep -RIl 'assets/vendor/leaflet/leaflet.js?v=1.9.4' pages/climate/evidence-explorer --include='index.html' | wc -l)" -eq 5
          ! grep -R 'unpkg.com/leaflet' pages/climate/evidence-explorer --include='index.html'
          ! grep -R 'fwi-leaflet-resize-fix.js' pages/climate/evidence-explorer --include='index.html'
          test ! -e assets/fwi-leaflet-resize-fix.js

      - name: Commit integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/fwi-planetary-map.js assets/fwi-planetary-map.css pages/climate/evidence-explorer
          if git diff --cached --quiet; then
            echo 'Self-host integration is already applied.'
            exit 0
          fi
          git commit -m 'Self-host Leaflet 1.9.4 and control map sizing [skip leaflet-self-host]'
          git push origin HEAD:agent/self-host-leaflet-1-9-4

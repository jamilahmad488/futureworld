name: FWI Gate v2 Bootstrap Verification

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/fwi-gate-bootstrap.yml"

permissions:
  contents: read

jobs:
  bootstrap_verification:
    name: FWI Fact-Check Gate
    if: github.event.pull_request.number == 10 && github.head_ref == 'agent/fix-gate-comment-delivery'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout the scoped adoption branch without persistent credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/fwi_governance_gate.py
            .github/tests/test_fwi_governance_gate.py
            .github/workflows/fwi-governance-gate.yml
          sparse-checkout-cone-mode: false
      - name: Compile the gate and regression suite
        run: python -m py_compile .github/scripts/fwi_governance_gate.py .github/tests/test_fwi_governance_gate.py
      - name: Run all gate regression tests
        run: python -m unittest discover -s .github/tests -p 'test_*.py' -v
      - name: Verify the permanent gate trust boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          workflow = Path('.github/workflows/fwi-governance-gate.yml').read_text(encoding='utf-8')
          assert 'pull_request_target:' in workflow
          assert 'persist-credentials: false' in workflow
          assert 'pull-requests: write' in workflow
          assert 'continue-on-error: true' in workflow
          assert 'github.event.pull_request.base.sha' in workflow
          assert 'github.event.pull_request.head.sha' not in workflow.split('Inventory pull-request file metadata', 1)[0]
          actions = re.findall(r'uses:\s*([^\s#]+)', workflow)
          assert actions and all(re.search(r'@[0-9a-f]{40}$', item) for item in actions)
          print('Permanent trusted-base workflow boundary verified.')
          PY

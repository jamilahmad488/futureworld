backend:
  name: turbo-github
  turbo_site_id: 455ef8ce-07d0-448a-a892-26dc8517df25

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

publish_mode: editorial_workflow

collections:
  - name: "climate"
    label: "Climate Intelligence"
    folder: "content/climate/cms"
    create: true
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}"
    fields:
      - {label: "Layout", name: "layout", widget: "hidden", default: "fwi-article"}
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Publication date", name: "date", widget: "datetime"}
      - {label: "Summary", name: "summary", widget: "text"}
      - {label: "Author", name: "author", widget: "string", default: "FutureWorld Intelligence"}
      - {label: "Existing publication URL", name: "source_url", widget: "string", required: false}
      - {label: "Article", name: "body", widget: "markdown"}


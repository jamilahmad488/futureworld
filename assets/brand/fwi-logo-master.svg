<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1536" height="1024" viewBox="0 0 1536 1024"
     role="img" aria-labelledby="title description">
  <title id="title">FutureWorld Intelligence official logo</title>
  <desc id="description">The official FutureWorld Intelligence cinematic globe logo with a corrected institutional wordmark.</desc>

  <defs>
    <linearGradient id="repair-band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#02050a" stop-opacity="0"/>
      <stop offset="0.08" stop-color="#02050a" stop-opacity="0.98"/>
      <stop offset="0.92" stop-color="#02050a" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#02050a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4a8"/>
      <stop offset="0.42" stop-color="#ffc62f"/>
      <stop offset="1" stop-color="#f28a00"/>
    </linearGradient>
    <filter id="gold-glow" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <image x="0" y="0" width="1536" height="1024"
         xlink:href="fwi-logo-source.png" preserveAspectRatio="none"/>

  <!-- The repair band removes the defective raster subtitle while retaining the original artwork. -->
  <rect x="645" y="510" width="755" height="88" fill="url(#repair-band)"/>
  <line x1="660" y1="519" x2="1366" y2="519"
        stroke="#f59e0b" stroke-width="2" opacity="0.9"/>
  <text x="1013" y="566" text-anchor="middle"
        fill="url(#gold)" stroke="#b85c00" stroke-width="0.6"
        font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700"
        letter-spacing="10" textLength="455" lengthAdjust="spacingAndGlyphs"
        filter="url(#gold-glow)">INTELLIGENCE</text>
</svg>
